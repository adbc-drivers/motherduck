# Cancelled or crashed test runs never drop their adbc_ci_* MotherDuck database
# (see ci/scripts/pre-test.sh). This drops the ones that are old enough that no
# run can still be using them.

name: Sweep test databases

on:
  schedule:
    - cron: "0 6 * * 0" # Sundays, 06:00 UTC
  workflow_dispatch:
    inputs:
      min_age_hours:
        description: "Only drop databases at least this many hours old"
        default: "24"
      dry_run:
        description: "List the databases without dropping them"
        type: boolean
        default: false

concurrency:
  group: ${{ github.repository }}-${{ github.workflow }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  sweep:
    name: "drop stale adbc_ci_* databases"
    runs-on: ubuntu-latest
    environment: test
    env:
      MIN_AGE_HOURS: ${{ inputs.min_age_hours || '24' }}
      DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"

      - name: Install
        run: pip install duckdb

      - name: Sweep
        env:
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
        run: python ci/scripts/sweep_test_databases.py
